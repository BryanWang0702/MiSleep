# MiSleep documentation site configuration (mkdocs)
#
# Preview locally with:  mkdocs serve
# Build with:            mkdocs build
# The site is deployed to GitHub Pages by .github/workflows/docs.yml and
# served at https://bryanwang.cn/MiSleep/

site_name: MiSleep
site_description: Mice sleep EEG/EMG visualization, scoring and analysis
site_url: https://bryanwang.cn/MiSleep/
repo_url: https://github.com/BryanWang0702/MiSleep
theme:
  name: material
  # bright overall theme with a light header (the MiSleep logo is
  # black-on-transparent, so the header must stay light to be readable)
  palette:
    - scheme: default
      primary: white
      accent: blue-grey
  logo: imgs/entire_logo.png
  favicon: imgs/logo.png
  features:
    - content.code.copy
    - navigation.top

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - User guide: user_guide.md
  - Data formats: data_formats.md
  - Configuration: config_file.md
  - API reference: api_reference.md
  - Developer guide: developer_guide.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      guess_lang: false
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - toc:
      permalink: true
