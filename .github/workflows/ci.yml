name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PySide6 >= 6.6 needs libEGL/libGL at import time on Linux, which the
      # GitHub Ubuntu runners do not ship by default.
      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      # The lightgbm macOS wheels need the LLVM OpenMP runtime (libomp).
      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install libomp

      - name: Install package (core + GUI + analysis)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[analysis,dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests -q

  lint:
    name: Import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core only
        run: |
          pip install -e .
      - name: Verify core imports without PySide6 / torch
        run: |
          python -c "import misleep; print(misleep.__version__)"
          python -c "import misleep.analysis.transformer" || true
