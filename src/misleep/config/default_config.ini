# ============================================================
# MiSleep default configuration
# ============================================================
# This file ships with the package and is merged with the user
# configuration stored at:
#   Windows : %USERPROFILE%\.misleep\misleep_config.ini
#   macOS   : ~/.misleep/misleep_config.ini
#   Linux   : ~/.misleep/misleep_config.ini
#
# The GUI offers "Config" under the Help menu to open the USER
# configuration file with your system editor. Copy any section
# you want to customize from here and restart MiSleep.
#
# DO NOT edit this bundled file directly -- your changes would be
# overwritten on the next package update.

[gui]
version = v0.3.0
updatetime = 2025/01/01
marker = ['half_signal', 'first REM', 'WindEEG', 'W-R', 'maker']
startend = ['high_theta', 'REM', 'Wake', 'Spindle', 'SWA', 'start end label', 'start end label']
statemap = {"1": "NREM", "2": "REM", "3": "Wake", "4": "INIT"}
statecolor = {"1": "orange", "2": "skyblue", "3": "red", "4": "#ececec"}
startendcolor = {"NREM": "orange", "REM": "skyblue", "Wake": "red"}
statecolorbgalpha = 0.1
hypnogramstatealpha = 0.55
markerlinecolor = "red"
startendlinecolor = "blue"
freq_range = [0.5, 30]
openpath = .
theme = light
color_tone = black
spectrogram_cmap = jet

[spec]
win_length_sec = 10.0
nfft_sec = 10.0
gaussian_sigma = 1.0
